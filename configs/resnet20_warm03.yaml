# Frankle's successful ResNet setting (eta 0.03, 20k/30k warmup) rescaled to 10k/15k
name: warm03
lr: 0.03
warmup_iters: 10000
sam_rho: null
anchor_lam: null
model: resnet20
dataset: cifar10
momentum: 0.9
weight_decay: 1.0e-4
batch_size: 128
iters: 15000
milestones: [10000, 12500]
lr_decay: 0.1
prune_rate: 0.3
output_prune_scale: 0.5     # final linear layer pruned at half the global rate
rounds: 8
seeds: [0]
baselines: {reinit: [2, 4, 6, 8], shuffle: [4, 8]}   # rounds at which to run them
sharpness: {batch: 2048, iters: 20, micro_batch: 512, every: 250, dense_until: 3000, then_every: 1500}
divergence_val_acc: 0.15    # val acc below this = "ended at chance" -> diverged
trained_acc: 0.20           # baseline counts as trained if test acc > 20%
eval_batch: 1000
