# H4 (masks held fixed): (c) L2 anchor to theta_0 raises R_p without lowering sharpness; lam picked by --select-lam
name: h4_high_anchor
lr: 0.1
warmup_iters: 0
sam_rho: null
anchor_lam: auto
model: resnet20
dataset: cifar10
momentum: 0.9
weight_decay: 1.0e-4
batch_size: 128
iters: 15000
milestones: [10000, 12500]
lr_decay: 0.1
prune_rate: 0.3
output_prune_scale: 0.5     # final linear layer pruned at half the global rate
seeds: [0]
sharpness: {batch: 2048, iters: 10, micro_batch: 512, every: 500, dense_until: 3000, then_every: 3000, early: [25, 50, 100, 200]}
divergence_val_acc: 0.15    # val acc below this = "ended at chance" -> diverged
trained_acc: 0.20           # baseline counts as trained if test acc > 20%
eval_batch: 1000
rounds: 0                   # unused: masks come from mask_from
baselines: {}               # unused: see variants
mask_from: {condition: warm03, rounds: [3, 6, 8]}   # 34.3%, 11.8%, 5.8% remaining
variants: [ticket, shuffle]
anchor_lam_grid: [1.0e-3, 1.0e-2]
select_iters: 3000          # short selection run (anchor only)
select_round: 3             # 34.3% remaining
select_target: low          # match the R_0.2 of the low ticket
